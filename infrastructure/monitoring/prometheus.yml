global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: daytrader
    metrics_path: /internal/metrics
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets: [daytrader-api:8080]
