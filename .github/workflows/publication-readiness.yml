name: Publication Readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate publication contract
        run: python3 scripts/validate_publication_readiness.py
      - name: Test publication validator
        run: python3 scripts/test_validate_publication_readiness.py
