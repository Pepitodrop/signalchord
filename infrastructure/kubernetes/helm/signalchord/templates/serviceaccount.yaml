{{- if .Values.serviceAccount.create }}
{{- range $name, $workload := .Values.workloads }}
{{- if $workload.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "signalchord.workloadServiceAccountName" (dict "root" $ "name" $name) }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: signalchord
  {{- with (index $.Values.serviceAccount.workloadAnnotations $name) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if .Values.feedCollector.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "signalchord.workloadServiceAccountName" (dict "root" . "name" "feed-collector") }}
  labels:
    app.kubernetes.io/name: feed-collector
    app.kubernetes.io/part-of: signalchord
  {{- with (index .Values.serviceAccount.workloadAnnotations "feed-collector") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.migrationJob.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "signalchord.workloadServiceAccountName" (dict "root" . "name" "migration") }}
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/part-of: signalchord
  annotations:
    # migration-job.yaml is a pre-install,pre-upgrade hook (hook-weight -5) that
    # runs before Helm creates this chart's ordinary resources -- including this
    # ServiceAccount. Making this a hook too, at an earlier weight, ensures it
    # exists before the migration Job's pod is created. "before-hook-creation"
    # (without "hook-succeeded") replaces it on the next install/upgrade but
    # never deletes it mid-release, so it's still there for the Job that needs it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with (index .Values.serviceAccount.workloadAnnotations "migration") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
