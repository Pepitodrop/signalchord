apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
spec:
  clusterIP: None
  # Required for KRaft bootstrap: kafka-0 resolves its own address via
  # kafka-0.kafka-headless (KAFKA_CONTROLLER_QUORUM_VOTERS below) to reach the
  # controller, but it can't pass its readiness probe until that connection
  # succeeds. Kubernetes only publishes a Pod's DNS record once it's Ready
  # (unless told otherwise), so without this the pod can never resolve itself
  # and never becomes Ready -- a deadlock, not a slow-startup issue.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
  ports:
    - {name: broker, port: 9092, targetPort: broker}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
spec:
  selector: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
  ports: [{name: broker, port: 9092, targetPort: broker}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: signalchord}
    spec:
      automountServiceAccountToken: false
      # See the same setting in neo4j.yaml: avoids Kubernetes auto-injecting
      # legacy Docker-links env vars (e.g. KAFKA_PORT_9092_TCP_PORT, since the
      # Service here is named "kafka") that could collide with Kafka's own
      # KAFKA_* environment-variable-to-config-property convention.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kafka
          image: {{ .Values.images.kafka | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk"}
          # KRaft controller-quorum formation on a first boot can take longer
          # than the readiness/liveness budgets below allow for, especially
          # under constrained CI CPU -- without this, the liveness probe can
          # SIGTERM the broker mid-startup (while it's waiting for the
          # controller to acknowledge it's caught up), aborting the process
          # instead of letting it finish. startupProbe defers readiness and
          # liveness checks until Kafka is actually serving.
          startupProbe:
            exec: {command: [sh, -c, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 45
          readinessProbe:
            exec: {command: [sh, -c, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe: {tcpSocket: {port: broker}, initialDelaySeconds: 60, periodSeconds: 20}
          resources:
            {{- toYaml .Values.resources.kafka | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
      terminationGracePeriodSeconds: 90
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClassName }}
        storageClassName: {{ .Values.storageClassName | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.persistence.kafka | quote }}}}